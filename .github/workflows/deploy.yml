name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # lets you re-deploy from the Actions tab without pushing a commit
  workflow_dispatch:

# GITHUB_TOKEN needs these to hand the built site to Pages
permissions:
  contents: read
  pages: write
  id-token: write

# a run already in flight is stale the moment another push lands, but let it
# finish rather than leaving the site half-deployed
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # better-sqlite3 ships prebuilds; npm ci keeps the lockfile authoritative
      - run: npm ci
      - run: npm run generate
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
